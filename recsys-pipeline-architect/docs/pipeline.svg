<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Six-stage recsys pipeline: candidates flow through Source, Hydrator, Filter, Scorer, Selector, then async SideEffect">
  <rect width="900" height="280" fill="#fafafa"/>

  <text x="450" y="30" text-anchor="middle" style="font:600 17px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#0f172a">Six-stage recsys pipeline</text>
  <text x="450" y="50" text-anchor="middle" style="font:400 12px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#64748b">top-K items for any (user, context)</text>

  <!-- Stage 1: Source -->
  <g>
    <rect x="13" y="70" width="134" height="130" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="25" y="84" width="28" height="20" rx="5" fill="#dbeafe"/>
    <text x="39" y="99" text-anchor="middle" style="font:700 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#1e40af">01</text>
    <text x="80" y="130" text-anchor="middle" style="font:700 18px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#0f172a">Source</text>
    <rect x="46" y="142" width="68" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="80" y="157" text-anchor="middle" style="font:600 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#1e40af">parallel</text>
    <text x="80" y="184" text-anchor="middle" style="font:400 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#64748b">fetch candidates</text>
  </g>

  <!-- Stage 2: Hydrator -->
  <g>
    <rect x="161" y="70" width="134" height="130" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="173" y="84" width="28" height="20" rx="5" fill="#dbeafe"/>
    <text x="187" y="99" text-anchor="middle" style="font:700 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#1e40af">02</text>
    <text x="228" y="130" text-anchor="middle" style="font:700 18px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#0f172a">Hydrator</text>
    <rect x="194" y="142" width="68" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="228" y="157" text-anchor="middle" style="font:600 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#1e40af">parallel</text>
    <text x="228" y="184" text-anchor="middle" style="font:400 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#64748b">enrich metadata</text>
  </g>

  <!-- Stage 3: Filter -->
  <g>
    <rect x="309" y="70" width="134" height="130" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="321" y="84" width="28" height="20" rx="5" fill="#fef3c7"/>
    <text x="335" y="99" text-anchor="middle" style="font:700 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#92400e">03</text>
    <text x="376" y="130" text-anchor="middle" style="font:700 18px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#0f172a">Filter</text>
    <rect x="338" y="142" width="76" height="22" rx="11" fill="#fffbeb" stroke="#fde68a"/>
    <text x="376" y="157" text-anchor="middle" style="font:600 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#92400e">sequential</text>
    <text x="376" y="184" text-anchor="middle" style="font:400 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#64748b">drop ineligible</text>
  </g>

  <!-- Stage 4: Scorer -->
  <g>
    <rect x="457" y="70" width="134" height="130" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="469" y="84" width="28" height="20" rx="5" fill="#fef3c7"/>
    <text x="483" y="99" text-anchor="middle" style="font:700 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#92400e">04</text>
    <text x="524" y="130" text-anchor="middle" style="font:700 18px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#0f172a">Scorer</text>
    <rect x="486" y="142" width="76" height="22" rx="11" fill="#fffbeb" stroke="#fde68a"/>
    <text x="524" y="157" text-anchor="middle" style="font:600 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#92400e">sequential</text>
    <text x="524" y="184" text-anchor="middle" style="font:400 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#64748b">assign scores</text>
  </g>

  <!-- Stage 5: Selector -->
  <g>
    <rect x="605" y="70" width="134" height="130" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="617" y="84" width="28" height="20" rx="5" fill="#d1fae5"/>
    <text x="631" y="99" text-anchor="middle" style="font:700 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#065f46">05</text>
    <text x="672" y="130" text-anchor="middle" style="font:700 18px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#0f172a">Selector</text>
    <rect x="640" y="142" width="64" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="672" y="157" text-anchor="middle" style="font:600 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#065f46">top-K</text>
    <text x="672" y="184" text-anchor="middle" style="font:400 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#64748b">sort, take top K</text>
  </g>

  <!-- Stage 6: SideEffect (dashed border = async) -->
  <g>
    <rect x="753" y="70" width="134" height="130" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="765" y="84" width="28" height="20" rx="5" fill="#ede9fe"/>
    <text x="779" y="99" text-anchor="middle" style="font:700 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#5b21b6">06</text>
    <text x="820" y="130" text-anchor="middle" style="font:700 18px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#0f172a">SideEffect</text>
    <rect x="790" y="142" width="60" height="22" rx="11" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="820" y="157" text-anchor="middle" style="font:600 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#5b21b6">async</text>
    <text x="820" y="184" text-anchor="middle" style="font:400 11px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#64748b">log · cache · emit</text>
  </g>

  <!-- Solid arrows between cards 1→2, 2→3, 3→4, 4→5 -->
  <g style="fill:#94a3b8">
    <polygon points="153,131 159,135 153,139"/>
    <polygon points="301,131 307,135 301,139"/>
    <polygon points="449,131 455,135 449,139"/>
    <polygon points="597,131 603,135 597,139"/>
  </g>

  <!-- Dashed arrow between Selector and SideEffect (5→6, async, non-blocking) -->
  <g>
    <line x1="745" y1="135" x2="751" y2="135" style="stroke:#a78bfa;stroke-width:1.5;stroke-dasharray:2 2"/>
    <polygon points="745,131 751,135 745,139" style="fill:#a78bfa"/>
  </g>

  <!-- Candidate-count flow lane below the cards -->
  <g>
    <line x1="80" y1="227" x2="820" y2="227" style="stroke:#e2e8f0;stroke-width:1"/>
    <g style="font:500 10px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#475569">
      <circle cx="80"  cy="227" r="3" fill="#3b82f6"/>
      <text x="80"  y="246" text-anchor="middle">~10,000</text>
      <circle cx="228" cy="227" r="3" fill="#3b82f6"/>
      <text x="228" y="246" text-anchor="middle">~10,000</text>
      <circle cx="376" cy="227" r="3" fill="#f59e0b"/>
      <text x="376" y="246" text-anchor="middle">~4,000</text>
      <circle cx="524" cy="227" r="3" fill="#f59e0b"/>
      <text x="524" y="246" text-anchor="middle">~4,000</text>
      <circle cx="672" cy="227" r="3" fill="#10b981"/>
      <text x="672" y="246" text-anchor="middle">50</text>
      <circle cx="820" cy="227" r="3" fill="#8b5cf6"/>
      <text x="820" y="246" text-anchor="middle">50</text>
    </g>
  </g>

  <text x="450" y="269" text-anchor="middle" style="font:400 10.5px -apple-system,'Segoe UI',Helvetica,sans-serif;fill:#94a3b8">illustrative candidate counts — your filters and selector decide the actual reductions</text>
</svg>
